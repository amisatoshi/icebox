[package]
name = "icebox-core"
version = "0.3.1"
edition = "2021"
license = "MIT"
# Not published to crates.io (so path and git dependencies are fine for cargo-deny).
publish = false
description = "Third-party Frostsnap coordinator built on the official frostsnap crates"

[dependencies]
frostsnap_coordinator = { workspace = true }
frostsnap_core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
