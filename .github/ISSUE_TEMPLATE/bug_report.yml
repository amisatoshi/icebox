name: Bug report
description: Something in Icebox doesn't work as it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.
        **Never include backup words, private keys, a mainnet descriptor or mainnet addresses.**
        Security problems go to the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Plug in two devices
        2. Click New wallet…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Icebox version
      description: Help → About shows the version and the Frostsnap commit.
      placeholder: 0.2.0 (Frostsnap 233f93b6d4ad)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu / Debian
        - Fedora
        - Other Linux (say which below)
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Signet
        - Testnet
        - Regtest
        - Mainnet
        - Demo mode
        - Not wallet-related
  - type: input
    id: devices
    attributes:
      label: Devices
      description: How many devices, and their firmware version (shown on the Devices page).
      placeholder: 3 devices, all v0.4.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Terminal output from `cargo tauri dev`, if you have it. Check it first: remove any
        addresses or descriptors from mainnet wallets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no backup words, private keys, mainnet descriptors or mainnet addresses.
          required: true
