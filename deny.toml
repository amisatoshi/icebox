# cargo-deny policy, checked in CI. Run locally with: cargo install cargo-deny && cargo deny check
[graph]
all-features = false

[advisories]
# Fail on known vulnerabilities and on crates marked unsound. Yanked crates are an error too.
yanked = "deny"
# Each ignore says why it doesn't affect Icebox. Review them when the Frostsnap pin moves.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, not vulnerable; it comes in through the official Frostsnap crates (device message encoding) and has no maintained drop-in replacement there" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, not vulnerable; build-time only, via Tauri's GTK bindings on Linux" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6, not vulnerable; comes in through Tauri's opener and single-instance plugins (Linux D-Bus). Drop when Tauri moves to zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6, not vulnerable; same route as above" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6, not vulnerable; same route as above" },
  { id = "RUSTSEC-2023-0071", reason = "Marvin attack needs timing of RSA private-key operations; Icebox (via frostsnap_comms) only verifies device genuineness certificates with public keys" },
]

[licenses]
# Permissive licences compatible with shipping Icebox under MIT.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # secp256kfun, schnorr_fun, sigma_fun, vrf_fun (the cryptography under Frostsnap)
  "0BSD",
  # hex_lit: MIT plus "no false attribution", still permissive
  "MITNFA",
]
confidence-threshold = 0.9

# The official Frostsnap crates are MIT (LICENSE at the root of github.com/frostsnap/frostsnap)
# but don't declare it in their Cargo.toml files.
[[licenses.clarify]]
crate = "frostsnap_core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "frostsnap_coordinator"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "frostsnap_comms"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "frostsnap_macros"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "frost_backup"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The only git dependency allowed: the official Frostsnap crates, pinned to a commit.
allow-git = ["https://github.com/frostsnap/frostsnap"]
