<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Icebox (UI preview with fake devices)</title>
  <link rel="stylesheet" href="../ui/style.css">
</head>
<body>
  <!-- Generated from ui/index.html by dev/sync-preview.py. Runs the UI in a normal browser
       against the demo backend, with extra devices showing the warning states. -->
<!-- Phones: a top bar with a menu button; the sidebar becomes a drawer. Hidden on desktop. -->
  <header class="mobilebar" id="mobilebar">
    <button class="icon-btn" id="drawer-btn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="mobile-title" id="mobile-title">Icebox</span>
    <button class="chip" id="mobile-devices" aria-label="Devices"><span class="dot"></span><span id="mobile-device-count">0</span></button>
  </header>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="../ui/icon.png" alt="" class="brand-mark">
        <div>
          <div class="brand-name">Icebox</div>
          <div class="brand-sub">for Frostsnap</div>
        </div>
      </div>

      <section class="side-section">
        <div class="side-heading">
          <span>Plugged in</span>
          <span class="count" id="device-count">0</span>
        </div>
        <ul class="chain" id="device-chain"></ul>
        <p class="side-hint" id="device-hint">Connect a Frostsnap device with a USB cable.</p>
      </section>

      <section class="side-section grow">
        <div class="side-heading"><span>Wallets</span></div>
        <ul class="wallet-list" id="wallet-list"></ul>
        <button class="btn ghost full" id="new-wallet-btn">+ New multi-sig wallet</button>
        <button class="link side-link" id="restore-btn">Restore from devices</button>
        <button class="link side-link" id="watch-add-btn">Add watch-only wallet</button>
      </section>

      <nav class="side-foot">
        <button class="link" id="devices-btn">Devices</button>
        <button class="link" id="settings-btn">Settings</button>
      </nav>

      <!-- Phones only: what the desktop menu bar offers. -->
      <section class="side-section more-section">
        <div class="side-heading"><span>More</span></div>
        <button class="link side-item" data-menu="hide_balances" id="more-hide">Hide amounts</button>
        <button class="link side-item" data-menu="logs">Logs</button>
        <button class="link side-item" data-menu="guide">User guide</button>
        <button class="link side-item" data-menu="updates">Check for updates</button>
        <button class="link side-item" data-menu="report_bug">Report a bug</button>
        <button class="link side-item" data-menu="demo">Try demo mode</button>
        <button class="link side-item" data-menu="about">About Icebox</button>
      </section>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="../ui/demo.js"></script>
  <script src="mock-tauri.js"></script>
  <script src="../ui/app.js"></script>
</body>
</html>
